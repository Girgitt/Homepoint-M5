[platformio]
default_envs = m5stack-core2

[env:m5stack-core2]
; Use current Arduino-ESP32 3.x through the PlatformIO-compatible pioarduino platform.
; M5Stack itself tests current libraries with this platform as well.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.36/platform-espressif32.zip
board = m5stack-core2
framework = arduino
board_upload.flash_size = 16MB

monitor_speed = 115200
upload_speed = 1500000

board_build.filesystem = littlefs
board_build.partitions = partitions.csv

lib_compat_mode = strict
lib_ldf_mode = chain

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINOJSON_USE_LONG_LONG=1

lib_deps =
    m5stack/M5Unified @ 0.2.22
    bblanchon/ArduinoJson @ 7.4.3
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    256dpi/MQTT @ 2.5.3

[env:native]
platform = native
build_flags = -std=c++17
test_build_src = no
test_filter = native
